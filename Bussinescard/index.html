<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;

            font-family: Arial, sans-serif;

            background: #0f172a;

            overflow-x: hidden;

            transition: 0.4s ease;
        }

        /* ================= THEME BUTTON ================= */

        .theme-btn {
            position: fixed;

            top: 20px;
            right: 20px;

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #293449;
            border-radius: 50%;

            background: #111827;
            color: #facc15;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s ease;

            z-index: 1000;
        }

        .theme-btn:hover {
            transform: rotate(20deg) scale(1.05);
        }

        /* ================= CARD ================= */

        .card-box {
            width: 100%;
            max-width: 380px;

            padding: 25px 20px;

            background: #111827;

            border: 1px solid #293449;

            border-radius: 22px;

            color: white;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.45);

            transition: 0.4s ease;
        }

        .card-box:hover {
            transform: translateY(-4px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55);
        }

        /* ================= IMAGE ================= */

        .profile-img {
            width: 95px;
            height: 95px;

            max-width: 100%;

            object-fit: cover;

            border-radius: 50%;

            padding: 3px;

            border: 3px solid #6366f1;

            background: #111827;

            transition: 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        /* ================= NAME ================= */

        .name {
            margin-top: 13px;
            margin-bottom: 3px;

            font-size: 23px;

            font-weight: 700;

            word-wrap: break-word;
        }

        .designation {
            margin: 0;

            color: #818cf8;

            font-size: 14px;

            font-weight: 600;
        }

        /* ================= ABOUT ================= */

        .about {
            margin: 13px auto 17px;

            max-width: 320px;

            color: #9ca3af;

            font-size: 12px;

            line-height: 1.5;
        }

        /* ================= INFORMATION ================= */

        .info {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 10px;

            text-align: left;

            padding: 9px 10px;

            margin-bottom: 7px;

            border-radius: 9px;

            background: #182132;

            border: 1px solid transparent;

            transition: 0.3s ease;
        }

        .info:hover {
            background: #202b3f;

            border-color: #303d57;
        }

        .info i {
            width: 29px;
            height: 29px;

            min-width: 29px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 7px;

            background: #252f49;

            color: #818cf8;

            font-size: 13px;
        }

        .info span {
            min-width: 0;

            color: #d1d5db;

            font-size: 11px;

            line-height: 1.3;

            overflow-wrap: anywhere;
        }

        /* ================= LINE ================= */

        .line {
            width: 100%;

            height: 1px;

            background: #293449;

            margin: 16px 0 14px;
        }

        /* ================= SOCIAL ================= */

        .social {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 8px;
        }

        .social a {
            width: 37px;
            height: 37px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 9px;

            color: #cbd5e1;

            background: #182132;

            border: 1px solid #293449;

            text-decoration: none;

            font-size: 15px;

            transition: 0.3s ease;
        }

        .social a:hover {
            color: white;

            background: #6366f1;

            transform: translateY(-3px);

            border-color: #818cf8;
        }

        /* ================= CONTACT ================= */

        .contact {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 15px;

            padding: 8px 19px;

            border-radius: 18px;

            background: #6366f1;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

            transition: 0.3s ease;
        }

        .contact:hover {
            color: white;

            background: #4f46e5;

            transform: translateY(-2px);
        }

        /* ================================================= */
        /* ================= LIGHT MODE ==================== */
        /* ================================================= */

        body.light-mode {
            background: #f1f5f9;
        }

        body.light-mode .theme-btn {
            background: #ffffff;

            border-color: #d1d5db;

            color: #334155;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        body.light-mode .card-box {
            background: #ffffff;

            border-color: #dbe2ea;

            color: #111827;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.15);
        }

        body.light-mode .profile-img {
            background: #ffffff;
        }

        body.light-mode .about {
            color: #64748b;
        }

        body.light-mode .info {
            background: #f8fafc;

            border-color: #e2e8f0;
        }

        body.light-mode .info:hover {
            background: #eef2ff;

            border-color: #c7d2fe;
        }

        body.light-mode .info i {
            background: #e0e7ff;

            color: #4f46e5;
        }

        body.light-mode .info span {
            color: #334155;
        }

        body.light-mode .line {
            background: #e2e8f0;
        }

        body.light-mode .social a {
            background: #f8fafc;

            border-color: #e2e8f0;

            color: #475569;
        }

        body.light-mode .social a:hover {
            color: white;

            background: #6366f1;

            border-color: #818cf8;
        }

        /* ================= SMALL MOBILE ================= */

        @media (max-width: 360px) {

            body {
                padding: 10px;
            }

            .theme-btn {
                top: 12px;
                right: 12px;

                width: 38px;
                height: 38px;

                font-size: 16px;
            }

            .card-box {
                padding: 20px 15px;

                border-radius: 18px;
            }

            .profile-img {
                width: 82px;
                height: 82px;
            }

            .name {
                font-size: 21px;
            }

            .designation {
                font-size: 13px;
            }

            .about {
                font-size: 11px;

                margin-top: 10px;
                margin-bottom: 14px;
            }

            .info {
                padding: 8px;

                gap: 8px;
            }

            .info i {
                width: 27px;
                height: 27px;
                min-width: 27px;
            }

            .info span {
                font-size: 10px;
            }

            .social a {
                width: 34px;
                height: 34px;
            }

            .contact {
                margin-top: 13px;

                padding: 7px 17px;
            }
        }
    </style>

</head>

<body>

    <!-- DARK / LIGHT MODE BUTTON -->

    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
        <i class="bi bi-sun-fill"></i>
    </button>


    <div class="card-box">

        <!-- PROFILE IMAGE -->

        <img src="#yourimage" alt="Profile Photo" class="profile-img">


        <!-- NAME -->

        <h1 class="name">
            Name Surname
        </h1>


        <!-- DESIGNATION -->

        <p class="designation">
            Software Engineer
        </p>


        <!-- ABOUT -->

        <p class="about">
            Passionate about building modern applications
            and solving real-world problems with technology.
        </p>


        <!-- EMAIL -->

        <div class="info">

            <i class="bi bi-envelope-fill"></i>

            <span>
                yourGmail@gmail.com
            </span>

        </div>


        <!-- PHONE -->

        <div class="info">

            <i class="bi bi-telephone-fill"></i>

            <span>
                +91 xxxxxxxxxx
            </span>

        </div>


        <!-- LOCATION -->

        <div class="info">

            <i class="bi bi-geo-alt-fill"></i>

            <span>
                Pune, India
            </span>

        </div>


        <!-- EDUCATION -->

        <div class="info">

            <i class="bi bi-mortarboard-fill"></i>

            <span>
                B-Tech
            </span>

        </div>


        <!-- DIVIDER -->

        <div class="line"></div>


        <!-- SOCIAL LINKS -->

        <div class="social">

            <a href="#yourinstagram" target="_blank" aria-label="Instagram">

                <i class="bi bi-instagram"></i>

            </a>


            <a href="#yourlinkdin" target="_blank" aria-label="LinkedIn">

                <i class="bi bi-linkedin"></i>

            </a>


            <a href="#yourfacebook" target="_blank" aria-label="Facebook">

                <i class="bi bi-facebook"></i>

            </a>


            <a href="#yourgithub" target="_blank" aria-label="GitHub">

                <i class="bi bi-github"></i>

            </a>

        </div>


        <!-- CONTACT -->

        <a href="#youremail@gmail.com" class="contact">

            <i class="bi bi-envelope"></i>

            Contact Me

        </a>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- DARK / LIGHT MODE JS -->

    <script>

        function toggleTheme() {

            const body = document.body;
            const themeBtn = document.getElementById("themeBtn");

            body.classList.toggle("light-mode");

            if (body.classList.contains("light-mode")) {

                themeBtn.innerHTML = '<i class="bi bi-moon-fill"></i>';

            } else {

                themeBtn.innerHTML = '<i class="bi bi-sun-fill"></i>';

            }

        }

    </script>

</body>

</html>
